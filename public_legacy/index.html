<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shared 3D printer management dashboard">
  <title>Print Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loginView" class="login-shell">
    <section class="login-card">
      <div class="brand-mark">3D</div>
      <p class="eyebrow">PRINT HUB</p>
      <h1 data-i18n="welcome">Welcome back</h1>
      <p class="muted" data-i18n="loginSubtitle">Sign in to manage the shared printer.</p>
      <form id="loginForm" class="stack-form">
        <label><span data-i18n="username">Username</span>
          <select name="username" required>
            <option value="Abdullah">Abdullah</option>
            <option value="Basel">Basel</option>
            <option value="Saleh">Saleh</option>
          </select>
        </label>
        <label><span data-i18n="password">Password</span>
          <input name="password" type="password" autocomplete="current-password" placeholder="1234" required>
        </label>
        <label class="check-row"><input name="rememberMe" type="checkbox"> <span data-i18n="rememberMe">Remember me</span></label>
        <button class="btn primary wide" type="submit" data-i18n="login">Login</button>
        <p id="loginError" class="form-error" role="alert"></p>
      </form>
      <button id="loginLanguage" class="text-btn" type="button">العربية</button>
    </section>
  </div>

  <div id="appView" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="brand"><div class="brand-mark small">3D</div><div><strong>Print Hub</strong><small data-i18n="printerManager">Printer Manager</small></div></div>
      <nav id="nav" class="nav-list" aria-label="Main navigation">
        <button data-page="home" class="active"><span>⌂</span><b data-i18n="home">Home</b></button>
        <button data-page="queue"><span>☷</span><b data-i18n="queue">Queue</b></button>
        <button data-page="favorites"><span>☆</span><b data-i18n="favorites">Favorite</b></button>
        <button data-page="inventory"><span>◉</span><b data-i18n="inventory">Inventory</b></button>
        <button data-page="statistics"><span>⌁</span><b data-i18n="statistics">Statistics</b></button>
        <button data-page="history"><span>↺</span><b data-i18n="history">History</b></button>
        <button data-page="maintenance"><span>⌘</span><b data-i18n="maintenance">Maintenance</b></button>
        <button data-page="admin" class="admin-nav"><span>⚙</span><b data-i18n="adminPanel">Admin Panel</b></button>
      </nav>
      <div class="sidebar-foot"><span class="status-dot"></span><span data-i18n="serverConnected">Server connected</span></div>
    </aside>

    <div id="backdrop" class="backdrop"></div>
    <main class="main">
      <header class="topbar">
        <button id="menuButton" class="icon-btn menu-button" type="button" aria-label="Menu">☰</button>
        <div><p class="eyebrow" id="pageEyebrow">PRINT HUB</p><h1 id="pageTitle">Dashboard</h1></div>
        <div class="top-actions">
          <button id="languageButton" class="pill-btn" type="button">AR</button>
          <button id="themeButton" class="icon-btn" type="button" aria-label="Theme">☾</button>
          <button id="notificationButton" class="icon-btn notification-button" type="button" aria-label="Notifications">♢<span id="notificationCount" class="count hidden">0</span></button>
          <button id="profileButton" class="profile-chip" type="button"><span id="avatar">A</span><span><b id="profileName">Abdullah</b><small id="profileRole">Admin</small></span></button>
        </div>
      </header>
      <div id="pageContent" class="page-content"><div class="loader"></div></div>
    </main>
  </div>

  <aside id="notificationPanel" class="drawer" aria-hidden="true">
    <div class="drawer-head"><div><p class="eyebrow" data-i18n="updates">UPDATES</p><h2 data-i18n="notifications">Notifications</h2></div><button class="icon-btn drawer-close" type="button">×</button></div>
    <button id="readAllButton" class="text-btn" data-i18n="markAllRead">Mark all as read</button>
    <div id="notificationList" class="notification-list"></div>
  </aside>

  <aside id="profilePanel" class="drawer" aria-hidden="true">
    <div class="drawer-head"><div><p class="eyebrow" data-i18n="account">ACCOUNT</p><h2 data-i18n="settings">Settings</h2></div><button class="icon-btn drawer-close" type="button">×</button></div>
    <div class="profile-card"><div id="drawerAvatar" class="large-avatar">A</div><h3 id="drawerName">Abdullah</h3><span id="drawerRole" class="badge">Admin</span></div>
    <form id="passwordForm" class="stack-form panel-form">
      <h3 data-i18n="changePassword">Change password</h3>
      <label><span data-i18n="currentPassword">Current password</span><input name="currentPassword" type="password" required></label>
      <label><span data-i18n="newPassword">New password</span><input name="newPassword" type="password" minlength="4" required></label>
      <label><span data-i18n="confirmPassword">Confirm password</span><input name="confirmPassword" type="password" minlength="4" required></label>
      <button class="btn secondary wide" type="submit" data-i18n="updatePassword">Update password</button>
    </form>
    <button id="logoutButton" class="btn danger outline wide" type="button" data-i18n="logout">Logout</button>
  </aside>

  <div id="modal" class="modal-layer hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head"><div><p id="modalEyebrow" class="eyebrow">PRINT HUB</p><h2 id="modalTitle">Form</h2></div><button id="modalClose" class="icon-btn" type="button">×</button></div>
      <div id="modalBody"></div>
    </div>
  </div>
  <div id="toastRegion" class="toast-region" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-}
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-print_hub}
      PGUSER: ${POSTGRES_USER:-print_hub}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in Dokploy}
    expose:
      - "3000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-network

  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-print_hub}
      POSTGRES_USER: ${POSTGRES_USER:-print_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
      APP_PASSWORD_ABDULLAH: ${APP_PASSWORD_ABDULLAH:?Set APP_PASSWORD_ABDULLAH in Dokploy}
      APP_PASSWORD_BASEL: ${APP_PASSWORD_BASEL:?Set APP_PASSWORD_BASEL in Dokploy}
      APP_PASSWORD_SALEH: ${APP_PASSWORD_SALEH:?Set APP_PASSWORD_SALEH in Dokploy}
      APP_PASSWORD_ROCKS: ${APP_PASSWORD_ROCKS:?Set APP_PASSWORD_ROCKS in Dokploy}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
